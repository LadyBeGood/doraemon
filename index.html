<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doraemon</title>
</head>

<body>
    <!-- <img src="./reference.svg"> -->
    <div class="doraemon"></div>

    <style>
        
        body {
            height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        img,
        .doraemon {
            width: min(500px, 100vw);
        }

        .doraemon {
            /*====================================*/
            /* COLOURS                            */
            /*====================================*/
            --blue: #009ccf;
            --red: #cb222d;
            --yellow: #fcd441;
            --white: #f6f7f1;
            --black: #090a05;
            --brown: #625542;
            /* --black: red; */

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            aspect-ratio: 1/1;
            /* opacity: 0.5; */
            background-repeat: no-repeat;
            background-image: 
                /*====================================*/
                /* STROKES                            */
                /*====================================*/
                /* head outer */
                radial-gradient(ellipse 350% 100% at 50% 60%, transparent 45.75%, var(--black) 0 51.75%, transparent 0),
                radial-gradient(ellipse 465% 300% at 140% 150%, transparent 45.25%, var(--black) 0 47.5%, transparent 0),
                radial-gradient(ellipse 465% 300% at -35% 150%, transparent 45.25%, var(--black) 0 47.25%, transparent 0),
                radial-gradient(ellipse 2400% 1000% at -860% 300%, transparent 45.75%, var(--black) 0 46.5%, transparent 0),
                radial-gradient(ellipse 250% 250% at -45% 50%, transparent 45.25%, var(--black) 0 46.3%, transparent 0),
                radial-gradient(ellipse 610% 610% at -174% -110%, transparent 45.5%, var(--black) 0 46.4%, transparent 0),
                
                
                /* head left */
                radial-gradient(ellipse 495% 495% at -140% 192%, transparent 45.5%, var(--black) 0 46.9%, transparent 0),
                radial-gradient(ellipse 250% 250% at 145% 50%, transparent 45.25%, var(--black) 0 46.3%, transparent 0),
                radial-gradient(ellipse 390% 390% at 175% 175.25%, transparent 45.25%, var(--black) 0 46.6%, transparent 0),
                radial-gradient(ellipse 610% 610% at 279.25% -110%, transparent 45.5%, var(--black) 0 46.4%, transparent 0),
                
                /* head inner left */
                radial-gradient(ellipse 280% 280% at 126.5% 135.5%, transparent 45.1%, var(--black) 0 46.6%, transparent 0),
                radial-gradient(ellipse 370% 370% at 198.5% 44%, transparent 45.1%, var(--black) 0 46.1%, transparent 0),
                radial-gradient(ellipse 500% 500% at 300% -35%, green 45.1%, var(--black) 0 46.1%, blue 0),
                
                /* head inner right */
                radial-gradient(ellipse 280% 280% at -25.75% 135.5%, transparent 45.1%, var(--black) 0 46.6%, transparent 0),
                radial-gradient(ellipse 370% 370% at -116.6% 44%, transparent 45.1%, var(--black) 0 46.1%, transparent 0),


                /* left pupil */
                radial-gradient(ellipse 65% 100%, transparent 18%, var(--black) 0 49.5%, transparent 0),

                /* right pupil */
                
                radial-gradient(ellipse 65% 100%, transparent 18%, var(--black) 0 49.5%, transparent 0),
                /* left eye ball */
                radial-gradient(ellipse 83% 100%, var(--white) 45%, var(--black) 0 49.5%, transparent 0),
                
                /* right eye ball */
                radial-gradient(ellipse 83% 100% at 51%, var(--white) 45%, var(--black) 0 49.5%, transparent 0),


                /* nose */
                radial-gradient(at 40% 40%, var(--white) 12%, transparent 0),
                radial-gradient(var(--red) 42%, var(--black) 0 49.5%, transparent 0),

                /* nose to mouth line */
                linear-gradient(to right, transparent 0%, var(--black) 0 3%, transparent 0),

                /* mouth */
                radial-gradient(ellipse 308% 300% at 50% 0.25%, transparent 20%, var(--black) 0 20.4%, transparent 0),

                /* whishker 1 */
                linear-gradient(201deg, transparent 20%, var(--black) 0 22%, transparent 0),

                /* whishker 2 */
                linear-gradient(184deg, transparent 20%, var(--black) 0 22.75%, transparent 0),

                /* whishker 3 */
                linear-gradient(166deg, transparent 20%, var(--black) 0 22.5%, transparent 0),

                /* whishker 4 */
                linear-gradient(158.5deg, transparent 20%, var(--black) 0 22.5%, transparent 0),

                /* whishker 5 */
                linear-gradient(177deg, transparent 20%, var(--black) 0 22.5%, transparent 0),

                /* whishker 6 */
                linear-gradient(194deg, transparent 20%, var(--black) 0 22.5%, transparent 0),

                /* left hand */
                radial-gradient(var(--white) 44%, var(--black) 0 49.5%, transparent 0),

                /* left arm strokes */
                radial-gradient(ellipse 816% 640% at 360% -100%, transparent 44.5%, var(--black) 0 44.95%, transparent 0),
                radial-gradient(ellipse 530% 675% at -85% 300%, transparent 44.1%, var(--black) 0 45%, transparent 0),

                /* right hand */
                radial-gradient(var(--white) 44%, var(--black) 0 49.5%, transparent 0),
                
                /* right arm strokes */
                radial-gradient(400% 400% at -100% 170%, transparent 43.25%, var(--black) 0 44%, transparent 0),
                radial-gradient(600% 600% at 180% -190%, transparent 43.25%, var(--black) 0 46%, transparent 0),
                
                /* left foot */
                radial-gradient(calc(35.436% * 5.7) calc(12.445% * 5.7) at 42.5% 19%, transparent 43.6%, var(--black) 0 49%, transparent 0),
                radial-gradient(440% 200% at 180% -17%, transparent 43.6%, var(--black) 0 53%, transparent 0),
                radial-gradient(calc(17.636% * 9.5) calc(10.981% * 9.5) at 128% 51%, transparent 43.6%, var(--black) 0 50%, transparent 0),
                radial-gradient(calc(35.436% * 5.7) calc(12.445% * 5.7) at 42.5% 19%, transparent 44%, var(--black) 0 49.4%, transparent 0),
                radial-gradient(calc(17.636% * 17) calc(10.981% * 17) at -38% -29%, transparent 42.75%, var(--black) 0 51.5%, transparent 0),
                
                /* right foot */
                radial-gradient(calc(35.436% * 5.7) calc(12.445% * 5.7) at 59% 19.25%, transparent 43.6%, var(--black) 0 49%, transparent 0),
                radial-gradient(440% 200% at -80% -16.5%, transparent 43.6%, var(--black) 0 53.75%, transparent 0),
                radial-gradient(calc(17.636% * 9.5) calc(10.981% * 9.5) at -29% 51%, transparent 43.6%, var(--black) 0 50%, transparent 0),
                radial-gradient(calc(35.436% * 5.7) calc(12.445% * 5.7) at 59.5% 19%, transparent 44%, var(--black) 0 49.4%, transparent 0),
                radial-gradient(calc(17.636% * 17) calc(10.981% * 17) at 135% -20%, transparent 42.75%, var(--black) 0 51.5%, transparent 0),
                
                
                
                /* also bell */
                radial-gradient(ellipse 200% 140% at 168% 55%, transparent 37%, var(--black) 0 48%, transparent 0),
                radial-gradient(ellipse 220% 130% at -68% 59%, transparent 37%, var(--black) 0 48%, transparent 0),
                
                /* bell inner circle */
                radial-gradient(100% 90%, var(--brown) 20%, var(--black) 0 38.5%, transparent 0),
                
                /* bell line */
                linear-gradient(to right, var(--black) 16.75%, transparent 0),
                
                /* bell top curve */
                radial-gradient(ellipse 200% 100% at 51% 90%, transparent 37%, var(--black) 0 42.1%, transparent 0),
                
                /* bell bottom curve */
                radial-gradient(ellipse 200% 100% at 51% 90%, transparent 37%, var(--black) 0 42.1%, transparent 0),
                
                /* strap */
                radial-gradient(ellipse 280% 100% at 51% 22%, transparent 38%, var(--black) 0 39.5%, transparent 0),
                radial-gradient(ellipse 290% 100% at 90% -12.7%, transparent 38%, var(--black) 0 41.5%, transparent 0),
                radial-gradient(ellipse 310% 100% at 7% -12.5%, transparent 38%, var(--black) 0 41.5%, transparent 0),
                
                /* bell fill */
                linear-gradient(var(--yellow) 15%, transparent 0),
                linear-gradient(var(--yellow) 25%, transparent 0),
                linear-gradient(var(--yellow) 25%, transparent 0),

                /* bell */
                radial-gradient(ellipse 100% 90% at 49.75% 112%, var(--yellow) 44%, var(--black) 0 50%, transparent 0),
                radial-gradient(ellipse 100% 98% at 50.75% 7%, var(--yellow) 44%, var(--black) 0 49%, transparent 0),
                
                /* pocket bottom stroke */
                radial-gradient(ellipse 100% 94.33% at 50% 0%, var(--white) 40%, var(--black) 0 42%, transparent 0),
                
                /* pocket top stroke */
                radial-gradient(ellipse 500% 100% at 50% 80%, transparent 40%, var(--black) 0 42%, transparent 0),
                
                /* belly */
                radial-gradient(ellipse 100% 93.5% at 50% 32%, var(--white) 40%, var(--black) 0 41.5%, transparent 0),
                
                /* groin */
                radial-gradient(ellipse 200% 110% at 50% 70%, transparent 40%, var(--black) 0 53%, transparent 0),
                
                /* thigh */
                linear-gradient(to right, transparent 20%, var(--black) 0 27%, transparent 0),
                
                /* left torso */
                radial-gradient(900% 900% at 418% 39%, transparent 40.25%, var(--black) 0 40.5%, transparent 0),
                radial-gradient(500% 1200% at 251% -200%, transparent 43.5%, var(--black) 0 45.25%, transparent 0),
                
                radial-gradient(900% 900% at 418% 39%, transparent 38.75%, var(--blue) 0 40.5%, transparent 0),
                radial-gradient(500% 1200% at 251% -200%, transparent 30%, var(--blue) 0 45.25%, transparent 0),
                
                /* right torso */
                radial-gradient(900% 900% at -324% 39%, transparent 40.25%, var(--black) 0 40.5%, transparent 0),
                radial-gradient(500% 1200% at -144% -200%, transparent 43.6%, var(--black) 0 45.25%, transparent 0),
                
                radial-gradient(900% 900% at -324% 39%, transparent 38.75%, var(--blue) 0 40.5%, transparent 0),
                radial-gradient(500% 1200% at -144% -200%, transparent 30%, var(--blue) 0 45.25%, transparent 0),

                
                
                /*====================================*/
                /* FILLS                              */
                /*====================================*/
                linear-gradient(var(--blue) 6%, transparent 0),
                linear-gradient(var(--blue) 6%, transparent 0),
                linear-gradient(var(--blue) 99%, transparent 0),
                linear-gradient(var(--blue) 42%, transparent 0),
                linear-gradient(var(--blue) 42%, transparent 0)

                ;
            background-size:
                /*====================================*/
                /* STROKES                            */
                /*====================================*/
                /* head outer */
                10% 10%,
                10% 10%,
                10% 10%,
                6% 6%,
                25.5% 25.5%,
                11.5% 11.5%,
                
                /* head left */
                10% 10%,
                25.5% 25.5%,
                14% 14%,
                11.5% 11.5%,
                
                /* head inner left */
                14.25% 14.25%,
                14.25% 14.25%,
                14.25% 14.25%,

                14.25% 14.25%,
                14.25% 14.25%,

                /* left pupil */
                5.25% 5.25%,

                /* right pupil */
                5.25% 5.25%,

                /* left eye ball */
                16% 16%,

                /* right eye ball */
                16% 16%,


                /* nose */
                12.25% 12.25%,
                12.25% 12.25%,
                
                /* nose to mouth line */
                19.5% 19.5%,

                /* mouth */
                44% 44%,

                /* whishker 1 */
                16% 16%,

                /* whishker 2 */
                14.5% 14.5%,

                /* whishker 3 */
                14.75% 14.75%,
                
                /* whishker 4 */
                15.8% 15.8%,
                
                /* whishker 5 */
                15% 15%,
                
                /* whishker 6 */
                14.75% 14.75%,

                /* left hand */
                17.75% 17.75%,

                /* left arm strokes */
                17.5% 17.5%,
                11% 11%,

                /* right hand */
                16.5% 16.5%,
                
                /* right arm strokes */
                16.5% 16.5%,
                3.5% 3.5%,
                
                
                /* left foot */
                15% 15%,
                3% 3%,
                8.5% 8.5%,
                14% 14%,
                4% 4%, 
                
                /* right foot */
                15% 15%,
                3% 3%,
                8.5% 8.5%,
                14% 14%,
                4% 4%,

                
                /* also bell */
                3% 3%,
                3% 3%,
                
                
                
                
                /* bell inner circle */
                3.5% 3.5%,
                
                /* bell inner line */
                3.8% 3.8%,
                
                /* bell top curve */
                10.1% 10.1%,
                
                /* bell bottom curve */
                10.1% 10.1%,
                
                /* strap */
                39.5% 39.5%,
                15.9% 15.9%,
                15.9% 15.9%,
                
                /* bell fill */
                8.25% 10%,
                3% 5%,
                3% 5%,

                /* bell */
                10.5% 10.5%,
                11% 11%,

                /* pocket bottom stroke */
                30.5% 30.5%,
                
                /* pocket top stroke */
                25.5% 25.5%,
                
                /* belly */
                40% 40%,

                /* groin */
                5% 5%,
                
                /* thighs */
                10% 10%,
                
                /* left torso */
                25% 25%,
                6.5% 6.5%,
                
                25% 25%,
                6.5% 6.5%,
                
                /* right torso */
                25% 25%,
                6.5% 6.5%,
                
                25% 25%,
                6.5% 6.5%,

                

                /*====================================*/
                /* FILLS                              */
                /*====================================*/
                15% 15%,
                15% 15%,
                35% 35%,
                13% 13%,
                13% 13%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%,
                100% 100%
                ;
            background-position:
            /*====================================*/
            /* STROKES                            */
                /*====================================*/
                /* head outer */
                53% -0.75%,
                42% -0.75%,
                64% -0.75%,
                71.75% 3%,
                88% 21.25%,
                80% 46.5%,

                /* head left */
                81.6% 6.5%,
                20% 21.25%,
                27.75% 2.25%,
                26% 46.5%,
                
                /* head inner left */
                30.4% 12.25%,
                25% 29%,
                29% 45.25%,
                
                /* head inner right */
                76.5% 12.25%,
                85% 29%,

                /* left pupil */
                49.3% 9.25%,

                /* right pupil */
                56.9% 9.14%,

                /* left eye ball */
                46% 2.8%,

                /* right eye ball */
                61% 2.8%,


                /* nose */
                53.25% 15.34%,
                53.25% 15.34%,

                /* nose to mouth line */
                65.25% 29%,

                /* mouth */
                55.5% 29%,

                /* whisker 1 */
                33.3% 21.1%,
                
                /* whisker 2 */
                33.8% 27.5%,
                
                /* whisker 3 */
                34.25% 35.75%,
                
                /* whisker 4 */

                /* whisker 5 */
                73.5% 27.25%,

                /* whisker 5 */
                73% 35.75%,

                /* left hand */
                11% 41.1%,

                /* left arm strokes */

                53.1% 62.5%,
                
                /* bell inner line */
                54.75% 64.5%,

                53.25% 59%,
                
                /* bell bottom curve */

                /* strap */
                54.9% 50%,
                39.4% 63%,
                67.75% 63%,
                
                /* bell fill */

                /* pocket bottom stroke */

                /* left torso */
